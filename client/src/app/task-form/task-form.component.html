<form class="tb-form" (ngSubmit)="add()">
  <input
    class="tb-input"
    type="text"
    name="title"
    placeholder="Ajouter une tâche…"
    [(ngModel)]="title"
  />
  <input
    class="tb-input tb-input--date"
    type="date"
    name="dueDate"
    aria-label="Date d'échéance"
    [(ngModel)]="dueDate"
  />
  <button class="tb-button" type="submit">Ajouter</button>
</form>
